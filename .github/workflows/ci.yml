name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          corepack enable
          # Pin to specific yarn version for consistency
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Configure yarn network settings
        run: |
          yarn config set network-timeout 300000
          yarn config set registry https://registry.npmjs.org/
          yarn config set httpRetryCount 5  
          yarn config set prefer-offline false
          yarn config set enableStrictSsl false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: |
          echo "Starting yarn install with enhanced error handling..."
          yarn install --frozen-lockfile --verbose --network-timeout 600000 || {
            echo "First attempt failed, trying with different registry..."
            yarn config set registry https://registry.yarnpkg.com/
            yarn install --frozen-lockfile --verbose --network-timeout 600000
          }

      - name: Run linting
        run: yarn lint

      - name: Run type checking
        run: yarn type-check

      - name: Run tests
        run: yarn test:ci
        env:
          CI: true
          REACT_APP_RPC_URL: ${{ secrets.REACT_APP_RPC_URL }}

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: success() && matrix.node-version == '20' # Only upload once
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false # Don't fail CI if codecov fails

      - name: Build application
        run: yarn build
        env:
          REACT_APP_RPC_URL: ${{ secrets.REACT_APP_RPC_URL }}

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Configure yarn network settings
        run: |
          yarn config set network-timeout 300000
          yarn config set registry https://registry.npmjs.org/

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run security audit
        run: yarn audit --level moderate

      - name: Check for vulnerabilities
        run: yarn audit --level high --production
